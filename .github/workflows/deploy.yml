# Deploy the Cascadia Tribal Hazard Dashboard to GitHub Pages (blueprint 2.1, 2.7, 6.5). Owner: lane L9.
#
# INERT UNTIL GATE V. Every job requires the repository variable CTHD_PAGES_ACTIONS to equal 'true'. The
# maintainer creates it only after switching the Pages source to GitHub Actions, so until then pushes, the
# schedule, and dispatches run no job and call no upstream, and the May 2026 branch build keeps serving.
#
# Compile curated data, write live snapshots (carrying forward any failed task), validate them, assemble
# _site/ with the versioned asset directory and the retained previous generation, then upload and deploy.
# Authenticates only with the built-in GITHUB_TOKEN (pages and id-token permissions); no other secret.
# Every action is a first-party actions/* action pinned by full commit SHA.
#
# Kill switch: setting the repository variable CTHD_SW_DISABLED to 'true' writes swDisabled: true into
# build-info.json on the next deploy, which makes the service worker unregister itself.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Off the hour, because top-of-hour cron queues longest (blueprint 2.7).
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate _site without uploading or deploying it
        type: boolean
        default: false
      snapshot_fail:
        description: Snapshot task ids to force to fail, comma separated (proves carry-forward)
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://atniclimate.github.io/pnw-tribal-dashboard/

jobs:
  deploy:
    name: Build and Deploy
    if: vars.CTHD_PAGES_ACTIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so assemble-site.mjs can restore the previous asset generation with git archive.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compile curated data
        run: node scripts/compile/all.mjs --fallback "${SITE_URL}data/curated/"
      - name: Write live snapshots
        env:
          SNAPSHOT_FAIL: ${{ inputs.snapshot_fail }}
        run: node scripts/snapshot/run.mjs --out site/data/live --previous "${SITE_URL}data/live/"
      - name: Validate live snapshots
        run: node scripts/check/validate-live.mjs site/data/live
      - name: Assemble the site
        env:
          SW_FLAG: ${{ vars.CTHD_SW_DISABLED == 'true' && '--sw-disabled' || '' }}
        run: node scripts/assemble-site.mjs --out _site --sha "$GITHUB_SHA" --previous "${SITE_URL}build-info.json" ${SW_FLAG:+"$SW_FLAG"}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ !inputs.dry_run }}
        with:
          path: _site
      - id: deployment
        if: ${{ !inputs.dry_run }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
