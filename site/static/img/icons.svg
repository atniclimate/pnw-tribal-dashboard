<svg xmlns="http://www.w3.org/2000/svg">
  <!-- UI icons for the Cascadia Tribal Hazard Dashboard: 24-unit grid, 2-unit square-capped strokes in
       currentColor, used with <svg><use href="../static/img/icons.svg#i-call"/></svg> beside a visible
       word (icons never carry meaning alone). Drawn for lane L1, 10/05/2026. -->
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M12 3 L22 20 H2 Z"/><path d="M12 10 V14"/><path d="M12 17 V17.01"/>
  </symbol>
  <symbol id="i-river" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
    <path d="M2 8 C5 5 7 11 10 8 S15 5 18 8 20 10 22 8"/><path d="M2 14 C5 11 7 17 10 14 S15 11 18 14 20 16 22 14"/><path d="M2 20 C5 17 7 23 10 20 S15 17 18 20 20 22 22 20"/>
  </symbol>
  <symbol id="i-call" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M5 3 H9 L11 8 L8.5 9.5 C9.5 11.8 12.2 14.5 14.5 15.5 L16 13 L21 15 V19 C21 20.1 20.1 21 19 21 C10.2 21 3 13.8 3 5 C3 3.9 3.9 3 5 3 Z"/>
  </symbol>
  <symbol id="i-near-me" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M12 22 C12 22 4 14.5 4 9.5 A8 8 0 0 1 20 9.5 C20 14.5 12 22 12 22 Z"/><path d="M10 8 H14 V12 H10 Z"/>
  </symbol>
  <symbol id="i-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M2 5 L8 3 L16 5 L22 3 V19 L16 21 L8 19 L2 21 Z"/><path d="M8 3 V19"/><path d="M16 5 V21"/>
  </symbol>
  <symbol id="i-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M14 3 H21 V10"/><path d="M21 3 L11 13"/><path d="M18 14 V21 H3 V6 H10"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
    <path d="M5 5 L19 19"/><path d="M19 5 L5 19"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
    <path d="M12 4 V20"/><path d="M4 12 H20"/>
  </symbol>
  <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
    <path d="M4 12 H20"/>
  </symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M9 5 L16 12 L9 19"/>
  </symbol>
  <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor">
    <path d="M7 4 L20 12 L7 20 Z"/>
  </symbol>
  <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor">
    <path d="M6 4 H10 V20 H6 Z"/><path d="M14 4 H18 V20 H14 Z"/>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M20 12 A8 8 0 1 1 17.7 6.3"/><path d="M20 3 V8 H15"/>
  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M8 8 H20 V20 H8 Z"/><path d="M16 4 H4 V16"/>
  </symbol>
  <symbol id="i-print" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M6 9 V3 H18 V9"/><path d="M6 18 H3 V9 H21 V18 H18"/><path d="M6 14 H18 V21 H6 Z"/>
  </symbol>
</svg>
