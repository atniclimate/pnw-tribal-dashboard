id: "2025-12-atmospheric-river"
title: "December 2025 Atmospheric River and Flooding"
period: { start: "2025-12-05", end: "2025-12-19" }
summary: "A long-lasting atmospheric river brought record flooding, landslides, and evacuations to western Washington and neighboring areas in December 2025. The State of Washington, Tribal governments, and counties issued emergency proclamations, and the federal government later declared an emergency and a major disaster."
archivedAt: "2026-10-05"
compiledFrom: "Items moved out of the legacy Resources page and re-sourced from the issuing governments or news reports; each entry keeps its original date and was link checked on 10/05/2026. Legacy hardcoded monitor rows without a verifiable source were not migrated."
