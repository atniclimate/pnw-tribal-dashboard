notes: Fills gaps where BIA LAR has no polygon. Only the two legal classes are used (MTFCC G2101 reservations and G2102 off-reservation trust land); statistical areas (G2120 and higher) stay excluded while boundary_policy.census_statistical_areas is false. AIANNHCE and GEOID are matched to a Nation by exact normalized name (crosswalk-us.json). Representation, not jurisdiction.
