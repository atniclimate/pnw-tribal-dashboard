id: nwps-hydrograph-images
title: National Water Prediction Service Hydrograph Images
owner: National Weather Service, National Water Center (NOAA)
url: https://water.noaa.gov/resources/hydrographs/
urlTemplate: https://water.noaa.gov/resources/hydrographs/{lid}_hg.png
humanUrl: https://water.noaa.gov/
license: Public domain (U.S. Government work).
attribution: NOAA National Weather Service, National Water Prediction Service
cadence: Regenerated by the National Water Prediction Service as gauge observations and forecasts update.
region: us
coverage: [WA, OR, ID]
kind: image
status: active
deprecation: null
access:
  mode: image
  cors:
    status: verified-wildcard
    acao: '*'
    origin: https://atniclimate.github.io
    checkedAt: 2026-10-05
    evidence: GET /resources/hydrographs/mvew1_hg.png with an Origin header returned Access-Control-Allow-Origin star and image/png on 10/05/2026.
  timeoutMs: 15000
  retries: 1
  priority: 3
freshness:
  freshForMs: 1800000
  usableForMs: 21600000
usedBy: [dashboard, forecasts]
verifiedAt: 2026-10-05
notes: One image per gauge, 17 to 20 KB, used instead of the stage-flow JSON (425 KB to 1.3 MB). Only valid lids are requested; the image always ships with alt text naming the latest and crest values and a text table.
