notes: Files z_16ap26 (public), c_16ap26 (county), fz16ap26 (fire weather), mz16ap26 (coastal marine), and oz16ap26 (offshore marine), all effective 04/16/2026. Public zone ids are STATE_ZONE; county ids are the state, C, and the last three FIPS digits; fire weather and public zone numbers can coincide, so every key carries its type.
