id: carto-dark-matter
title: CARTO Dark Matter Basemap Tiles
owner: CARTO, with map data from OpenStreetMap contributors
url: https://basemaps.cartocdn.com/dark_all
urlTemplate: https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png
humanUrl: https://carto.com/basemaps/
license: Free non-commercial tier (5 million tile requests a month) with an ATNI API key, CARTO Basemap Terms updated 09/29/2026; map data under the Open Database License, copyright OpenStreetMap contributors.
attribution: © OpenStreetMap contributors © CARTO
cadence: Static basemap tiles; the style changes rarely.
region: both
coverage: [WA, OR, ID, BC, CA-N, MT-W, NV-N, AK-SE]
kind: xyz-tiles
status: active-pending-terms
deprecation: null
access:
  mode: tiles
  cors:
    status: verified-wildcard
    acao: "*"
    origin: https://atniclimate.github.io
    checkedAt: 2026-10-05
    evidence: "Tile 6/10/22.png on the bare host basemaps.cartocdn.com with Origin https://atniclimate.github.io returned HTTP 200, image/png, Access-Control-Allow-Origin * on 10/05/2026."
  timeoutMs: 15000
  retries: 1
  priority: 3
health:
  probe: https://basemaps.cartocdn.com/dark_all/6/10/22.png
  expectStatus: 200
  expectAcao: "*"
  expectType: image/png
  minBytes: 500
  maxBytes: null
usedBy: [dashboard, alerts, forecasts]
verifiedAt: 2026-10-05
notes: "One host, no subdomain list; the @2x tile URL is used on high-density screens. Outline mode is the fallback when tiles fail. The attribution is always visible. Decided 10/05/2026 (Q10): allowed with an ATNI key locked to https://atniclimate.github.io; keyless tiles return a watermark (ETag begins wm-, 2,513 bytes) that passes the byte-size check, so the probe script must reject that ETag. Fallback if refused: OpenFreeMap Dark vector style, attribution OpenFreeMap © OpenMapTiles Data from OpenStreetMap. Until the key is installed and this record is active, the map module draws no basemap (no tile request) and its legend says so."
