notes: Used for headquarters points (latitude and longitude attributes, not the Web Mercator geometry), the Directory tribefullname cross-check to the Federal Register, and the main-line fallback in Contacts. Only the OBJECTID, tribefullname, tribealternatename, tribalcomponent, biaregion, biaagency, city, state, website, latitude, longitude, LARtype, pointlocation, tribeshortname, and tribalcomponentname fields are ever read. Leader names, individual emails, elections, and every other person field are excluded by an allowlist.
