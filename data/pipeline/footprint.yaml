# Footprint definition: the coverage area of the dashboard (blueprint 6.2, question Q2).
#
# Ratified by the maintainer on 10/05/2026 (packet amendments, Section E). Counties are Census cartographic boundary
# NAME values (2024), state by state.
ratified: true
ratifiedOn: '2026-10-05'
states: [WA, OR, ID]
provinces: [BC]
counties:
  # Northern California: the eleven counties proposed in Q2, ratified as drafted.
  CA: [Del Norte, Humboldt, Trinity, Mendocino, Siskiyou, Modoc, Shasta, Lassen, Tehama, Plumas, Lake]
  # Western Montana: counties west of the Continental Divide, plus Glacier and Pondera (Blackfeet Nation) and Hill and
  # Chouteau (Chippewa Cree Tribe), ruled in 10/05/2026.
  MT: [Lincoln, Flathead, Sanders, Lake, Mineral, Missoula, Ravalli, Granite, Powell, Deer Lodge, Silver Bow, Beaverhead, Glacier, Pondera, Hill, Chouteau]
  # Northern Nevada: Elko (Duck Valley) and Humboldt (Fort McDermitt), as alert geometry only.
  NV: [Elko, Humboldt]
  # Southeast Alaska: the ten boroughs and census areas proposed in Q2, ratified as drafted.
  AK: [Yakutat, Hoonah-Angoon, Skagway, Haines, Juneau, Sitka, Petersburg, Wrangell, Ketchikan Gateway, Prince of Wales-Hyder]
notes: Ratified 10/05/2026 (packet amendments) on the maintainer's approval. Blackfeet Nation and Chippewa Cree Tribe are in. Northern Nevada Nations are only the Shoshone-Paiute Tribes of the Duck Valley Reservation and the Fort McDermitt Paiute and Shoshone Tribes (scope.yaml includes); Elko and Humboldt counties are alert geometry only. British Columbia is the whole province, drawn from the Emergency Management and Climate Readiness response regions.
