# Explicit includes and excludes beyond the rule-driven footprint (blueprint 6.2; schema registry-scope).
# Keys are the ids.lock keys: `bia-tld:<Directory tribefullname>`, `bia-anv:<name>`, or `isc:<band number>`.
# Rules in scripts/reference/50-registry.mjs: Washington, Oregon, and Idaho Tribes by Directory state; northern
# California by headquarters county; Southeast Alaska by headquarters borough or census area (both lists ratified
# with footprint.yaml on 10/05/2026); every First Nation with a headquarters inside (or within ten kilometres of the
# outline of) British Columbia or a reserve polygon in the NRCan British Columbia layer. Every entry below was approved
# by the maintainer on 10/05/2026 (packet amendments, Section D).
include:
  - key: 'bia-tld:Confederated Salish and Kootenai Tribes of the Flathead Reservation'
    reason: Western Montana, west of the Continental Divide (Lake County). Footprint ratified 10/05/2026.
    sourceUrl: null
  - key: 'bia-tld:Shoshone-Paiute Tribes of the Duck Valley Reservation, Nevada'
    reason: Northern Nevada, named in the Data Rulings (Duck Valley). The reservation lies on the Idaho and Nevada line.
    sourceUrl: https://shopaitribes.org/
  - key: 'bia-tld:Fort McDermitt Paiute and Shoshone Tribes of the Fort McDermitt Indian Reservation, Nevada and Oregon'
    reason: Northern Nevada, named in the Data Rulings (Fort McDermitt). The Directory name lists Nevada and Oregon.
    sourceUrl: null
  - key: 'bia-tld:Blackfeet Tribe of the Blackfeet Indian Reservation of Montana'
    reason: Included by the maintainer's ruling of 10/05/2026 (packet amendments, Section D). The Tribe is an ATNI member (ATNI Priority Climate Action Plan, April 2024, Table 3), so it is inside the ATNI service area; Glacier and Pondera counties are in the footprint.
    sourceUrl: https://www.epa.gov/system/files/documents/2024-04/atni-pcap.pdf
  - key: "bia-tld:Chippewa Cree Indians of the Rocky Boy's Reservation, Montana"
    reason: Included by the maintainer's ruling of 10/05/2026 (packet amendments, Section D). The Tribe is an ATNI member (ATNI Priority Climate Action Plan, April 2024, Table 3), so it is inside the ATNI service area; Hill and Chouteau counties are in the footprint.
    sourceUrl: https://www.epa.gov/system/files/documents/2024-04/atni-pcap.pdf
  - key: 'bia-tld:Elem Indian Colony of Pomo Indians of the Sulphur Bank Rancheria, California'
    reason: Included by the maintainer's ruling of 10/05/2026. The reservation lies in Lake County, which is on the northern California list; the Directory office point is in Santa Rosa (Sonoma County), so the headquarters rule alone would leave it out.
    sourceUrl: null
exclude:
  - key: 'bia-tld:Te-Moak Tribe of Western Shoshone Indians of Nevada (Four constituent bands: Battle Mountain Band; Elko Band; South Fork Band; and Wells Band)'
    reason: Excluded by the maintainer's ruling of 10/05/2026. The coverage ruling names northern Nevada as Duck Valley and Fort McDermitt only; Elko and Humboldt counties are alert geometry, not Nation membership.
    sourceUrl: null
  - key: 'isc:502'
    reason: Excluded by the maintainer's ruling of 10/05/2026. Liard First Nation has its headquarters at Watson Lake in Yukon; under the blueprint rule a British Columbia First Nation is one whose ISC location is in British Columbia, so its nine NRCan polygons stay unjoined.
    sourceUrl: null
