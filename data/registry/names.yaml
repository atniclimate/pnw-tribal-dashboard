# Ratified by the maintainer on 10/05/2026 (packet amendments, Sections C and D). Every ? in an ISC name stands for
# U+0294 LATIN LETTER GLOTTAL STOP; three names also lost U+0313 COMBINING COMMA ABOVE. ca-fn-709 is applied so that
# no displayed name carries a ?, but its record stays draft (its source is not the Nation's own site).
